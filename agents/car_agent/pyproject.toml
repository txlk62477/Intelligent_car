[project]
name = "intelligent-car-agent"
version = "0.0.1"
description = "LangGraph supervisor and ROS2 workflows for the Intelligent Car project."
license = "GPL-2.0-only"
requires-python = ">=3.10"
dependencies = [
    "langchain-deepseek>=1.0,<2.0",
    "langgraph>=1.2,<2.0",
    "python-dotenv>=1.0.1",
]


[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.4,<1.0",
    "mypy>=1.11.1",
    "pytest>=9.0.3",
    "ruff>=0.6.1",
]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*"]


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
    # Docstrings are written in Chinese; D415 demands an ASCII final period.
    "D415",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = ["-p", "no:launch_testing", "-p", "no:launch_ros"]
