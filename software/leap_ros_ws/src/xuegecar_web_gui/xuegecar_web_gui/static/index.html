<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>雪哥小车遥控</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- 状态栏：竖屏在顶部通栏，横屏收进右侧控制栏顶部 -->
  <header id="status-bar">
    <div class="pills">
      <span id="pill-conn" class="pill" role="status">未连接</span>
      <span id="pill-battery" class="pill">电池 --</span>
      <span id="pill-camera" class="pill">摄像头 --</span>
    </div>
  </header>

  <main>
    <!-- 摄像头 -->
    <section id="camera-card" class="card">
      <div class="camera-wrap">
        <img id="camera" alt="摄像头画面" decoding="async">
        <div id="camera-placeholder">等待摄像头…</div>
      </div>
      <div class="camera-meta">
        <span id="camera-fps">-- fps</span>
        <span id="speed-readout">下发 0.00 m/s · 0.00 rad/s</span>
      </div>
    </section>

    <div class="dashboard-bottom">
      <!-- 驾驶控制区 -->
      <section id="control-card" class="card">
        <div class="sliders">
          <label for="linear-slider">线速度 <span><b id="linear-value">0.30</b> m/s</span>
            <input type="range" id="linear-slider" min="0" max="2" step="0.05" value="0.3">
          </label>
          <label for="angular-slider">角速度 <span><b id="angular-value">1.00</b> rad/s</span>
            <input type="range" id="angular-slider" min="0" max="5" step="0.05" value="1.0">
          </label>
        </div>

        <div class="control-modes" role="group" aria-label="驾驶模式">
          <button type="button" class="control-mode" data-mode="dpad" aria-pressed="true">方向键</button>
          <button type="button" class="control-mode" data-mode="joystick" aria-pressed="false">摇杆</button>
        </div>
        <div class="control-panels">
          <div id="dpad-panel" class="panel">
            <div class="dpad">
              <button type="button" class="dpad-btn" data-dir="up" aria-label="前进">▲</button>
              <button type="button" class="dpad-btn" data-dir="left" aria-label="左转">◀</button>
              <button type="button" class="dpad-btn" data-dir="right" aria-label="右转">▶</button>
              <button type="button" class="dpad-btn" data-dir="down" aria-label="后退">▼</button>
            </div>
          </div>
          <div id="joystick-panel" class="panel" hidden>
            <div id="joystick" aria-label="摇杆：前后调速度，左右调转向，松手停车">
              <span class="joystick-guide guide-up" aria-hidden="true">前进</span>
              <span class="joystick-guide guide-left" aria-hidden="true">左转</span>
              <span class="joystick-guide guide-right" aria-hidden="true">右转</span>
              <span class="joystick-guide guide-down" aria-hidden="true">后退</span>
              <span id="joystick-knob" aria-hidden="true"></span>
            </div>
          </div>
        </div>
      </section>

      <!-- 安全控制区 -->
      <section id="safety-card" class="card">
        <div class="safety-title">安全控制</div>
        <div class="safety-buttons">
          <button type="button" id="btn-estop" class="btn-warn">急停锁</button>
          <button type="button" id="btn-unlock" class="btn-ghost">解锁</button>
        </div>
      </section>
    </div>

    <footer id="hint">
      按住方向键或拖动摇杆行驶，松手停车 · 摇杆斜推走弧线 · 断线或切后台自动停车
    </footer>
  </main>

  <!-- 忙碌/断线遮罩 -->
  <div id="overlay" class="overlay hidden">
    <div class="overlay-box">
      <div class="overlay-icon">⚠</div>
      <div id="overlay-title">连接断开</div>
      <div id="overlay-desc">正在重连…</div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
