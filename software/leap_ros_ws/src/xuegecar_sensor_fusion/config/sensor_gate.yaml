sensor_gate_node:
  ros__parameters:
    input_odom_topic: "/odom"
    input_imu_topic: "/imu"
    output_odom_topic: "/fusion/odom_valid"
    output_imu_topic: "/fusion/imu_valid"

    # 宽松硬阈值：只剔除非有限值和物理上明显不可能的数据。
    max_abs_linear_velocity: 1.0       # m/s
    max_abs_linear_acceleration: 10.0  # m/s^2
    max_abs_odom_angular_velocity: 4.0 # rad/s
    max_abs_gyro_z: 4.0                # rad/s
    min_derivative_dt: 0.01            # s；更短的网络突发间隔不计算加速度
    reset_derivative_after_gap: 0.5    # s；长间隔后重建速度变化基准

    # fusion_calibration_02 实测：静止噪声 std≈0.0126 rad/s；
    # stddev 取 0.08 以覆盖真实转弯幅度（转弯 |gyro_z| 中位 0.29、最大 0.596），
    # 使 10σ 马氏门控能放行正常转弯而不是误拒。
    imu_gyro_z_bias: -0.00942          # rad/s
    odom_vx_stddev: 0.02               # m/s，线速度置信度
    odom_wz_stddev: 0.04               # rad/s，轮式角速度；权重约为 IMU 的 4 倍
    imu_gyro_z_stddev: 0.08            # rad/s

    # vx 与轮式角速度同时低于阈值并持续 0.2 s，才启用静止约束。
    # 约束生效时送入 EKF 的轮式与 IMU 角速度都为 0；检测到运动立即解除。
    stationary_linear_velocity_threshold: 0.005   # m/s
    stationary_angular_velocity_threshold: 0.01   # rad/s
    stationary_hold_duration: 0.2                 # s

    # 运动相位状态机（静止/直行/原地转弯/弧线）切换参数，带迟滞防抖。
    # 直行时轮式角速度 stddev=0.04，轮式:陀螺权重约 4:1；原地转弯时放大到
    # turn_odom_wz_stddev=0.16，权重反转为 1:4（打滑时轮式角速度不可靠）；
    # 弧线时取 0.08，权重 1:1。
    turn_enter_angular_velocity_threshold: 0.15   # rad/s，|wz| 达到并持续才进入转弯带
    turn_exit_angular_velocity_threshold: 0.10    # rad/s，|wz| 低于并持续才退出转弯带
    enter_hold_duration: 0.1                      # s，进入转弯带需持续时长
    exit_hold_duration: 0.2                       # s，退出转弯带需持续时长
    arc_min_abs_linear_velocity: 0.05             # m/s，|vx| 达到即弧线而非原地转弯
    arc_exit_abs_linear_velocity: 0.03            # m/s，弧线退出迟滞
    turn_odom_wz_stddev: 0.16                     # rad/s，原地转弯时轮式角速度置信度
    arc_odom_wz_stddev: 0.08                      # rad/s，弧线时轮式角速度置信度

    # MCU 时间差映射到由 CLOCK_MONOTONIC_RAW 推进的 ROS /clock。连续流始终
    # 保留 MCU dt；超过误差阈值只上报 source_clock_drift_samples，绝不跳时。
    max_time_mapping_error: 0.25         # s，触发时钟漂移诊断的阈值
    source_stamp_reset_after_gap: 1.0    # s，超过此断流时长允许时间基准重建

    diagnostic_timeout: 0.3
    diagnostic_period: 1.0
