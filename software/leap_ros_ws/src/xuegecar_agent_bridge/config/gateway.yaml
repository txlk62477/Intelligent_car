xuegecar_agent_bridge:
  ros__parameters:
    http_host: "127.0.0.1"
    http_port: 8765
    odom_topic: "/odometry/filtered"
    odom_timeout: 1.0
    action_timeout: 2.0
    history_size: 100
    follow_default_timeout: 60.0
    follow_max_timeout: 300.0
    camera_topic: "/camera/image_raw/compressed"
    snapshot_dir: "/home/lk/car/data/snapshots"
    snapshot_max_age: 5.0
    detections_topic: "/vision/detections"
    detections_max_age: 1.5
    detections_min_score: 0.35
    detections_max_items: 8
    detections_probe_timeout: 15.0
    detections_probe_runtime: 30.0
    map_topic: "/map"
    map_name: ""
    amcl_pose_topic: "/amcl_pose"
    amcl_pose_max_age: 2.0
    amcl_max_position_std: 0.25
    amcl_max_yaw_std: 0.349066
    navigation_goal_clearance: 0.20
    navigation_max_timeout: 900.0
    emergency_lock_topic: "/cmd_vel_emergency_lock"
    agent_cmd_vel_topic: "/cmd_vel_agent"
    nav_cmd_vel_topic: "/cmd_vel_nav"
    command_conflict_window: 0.30
